[package]
name = "rmk-gui"
version = "0.1.0"
description = "RMK GUI"
authors = [ "you" ]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0.229", features = [ "derive" ] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "sync",
  "time"
] }
# The Rynk host transports live upstream: rynk-serial recognises a keyboard by
# its USB serial marker, rynk-ble lists already-connected GATT peers. Neither is
# reimplemented here — discovery rules belong with the protocol.
rynk = { git = "https://github.com/rmk-rs/rmk.git", branch = "main" }
rynk-serial = { git = "https://github.com/rmk-rs/rmk.git", branch = "main" }
rynk-ble = { git = "https://github.com/rmk-rs/rmk.git", branch = "main" }
uuid = { version = "1.24.0", features = [ "v4" ] }

[lints.clippy]
all = "warn"
