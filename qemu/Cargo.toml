[package]
name = "rmk-qemu-riscv"
version = "0.2.0"
authors = [ "Haobo Gu <haobogu@outlook.com>" ]
description = "Keyboard firmware written in Rust"
homepage = "https://github.com/rmk-rs/rmk"
repository = "https://github.com/rmk-rs/rmk"
edition = "2024"
license = "MIT OR Apache-2.0"

# no_std/no_main firmware — disable std test/bench harness so `cargo clippy --all-targets` works.
[[bin]]
name = "rmk-qemu-riscv"
test = false
bench = false

# Start locked with an unlock challenge instead of `insecure`, for exercising
# the host's unlock ceremony.
[features]
locked = []

[dependencies]
rmk = { git = "https://github.com/rmk-rs/rmk.git", rev = "65df15775026bad1189139613ee3d338139bec3d", default-features = false, features = [ "rynk" ] }
embassy-executor = { version = "0.10", features = [
  "platform-riscv32",
  "executor-thread"
] }
embassy-futures = { version = "0.1" }
embassy-time = { version = "0.5", features = [
  "tick-hz-10_000_000",
  "generic-queue-8"
] }
embassy-time-driver = "0.2"
embassy-time-queue-utils = "0.3"
critical-section = "1.0"
riscv-rt = "0.18"
riscv = { version = "0.16", features = [ "critical-section-single-hart" ] }
semihosting = { version = "0.1", features = [ "stdio" ] }
embedded-io-async = "0.7"
panic-halt = "1.0"
static_cell = "2.0"
uart_16550 = "0.6"

[build-dependencies]
rmk-config = { git = "https://github.com/rmk-rs/rmk.git", rev = "65df15775026bad1189139613ee3d338139bec3d" }
